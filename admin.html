<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Fejlesztői mód – Nagybani Gastro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{--forest:#16381b;--green:#6fa838;--green-d:#4f8a27;--mint:#eaf3dc;--bg:#f5f8ef;--line:#dfe7d0;--muted:#5f6d55;--tomato:#e0442f;--warn:#9a5a1c;
  --serif:"Young Serif",Georgia,serif;--sans:"Instrument Sans",system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--forest);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{padding-bottom:110px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:8px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.top{background:var(--forest);color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;height:64px}
.top img{width:42px;height:42px;border-radius:50%;background:#fff}
.top h1{font-family:var(--serif);font-weight:400;font-size:20px;margin:0;flex:1}
.top a{color:#b9d79a;font-size:14px;font-weight:600;text-decoration:none}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 1px 2px rgba(22,56,27,.06)}
h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 6px}
.hint{color:var(--muted);font-size:14px;margin:0 0 14px;line-height:1.45}
label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
.field{width:100%;height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:16px;outline:none}
.field:focus{border-color:var(--green);background:#fff}
textarea.field{height:auto;min-height:70px;padding:10px 14px;resize:vertical}
.btn{height:48px;padding:0 20px;border:0;border-radius:12px;background:var(--forest);color:#fff;font-weight:700;font-size:15px;white-space:nowrap}
.btn.go{background:var(--green);color:var(--forest)}
.btn.ghost{background:#fff;color:var(--forest);border:1.5px solid var(--line)}
.btn.danger{background:#fff;color:var(--tomato);border:1.5px solid #f3c9c2}
.btn.danger.sure{background:var(--tomato);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--tomato);font-weight:600;font-size:14px;margin:10px 0 0}
.err:empty{display:none}
.login{max-width:420px;margin:40px auto}
.login .btn{width:100%;margin-top:18px}

.tools{position:sticky;top:0;z-index:10;background:var(--bg);padding:14px 0 10px;display:flex;gap:10px}
.tools .field{flex:1;min-width:0}
.cat{margin-top:22px}
.cat h3{font-family:var(--serif);font-weight:400;font-size:19px;margin:0 0 8px}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:6px;grid-template-columns:minmax(0,1fr)}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 8px 8px 10px}
.row .th{width:44px;height:44px;flex:none;border-radius:10px;background:var(--mint);overflow:hidden;display:grid;place-items:center;font-size:12px;color:var(--muted)}
.row .th img{width:100%;height:100%;object-fit:cover}
.row .main{flex:1;min-width:0;background:none;border:0;text-align:left;padding:4px 0}
.row .main b{display:block;font-weight:600;font-size:15.5px}
.row .main{overflow:hidden}
.row .main small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.b-off{background:#fdeedd;color:var(--warn)}.b-hid{background:#e9ece5;color:#6b7563}.b-cl{background:#e3f1f5;color:#2b6f85}
.mv{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:16px;color:var(--muted)}
.mv:disabled{opacity:.3}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.savebar .wrap{display:flex;align-items:center;gap:12px}
.savebar span{flex:1;font-size:14px;color:var(--muted);font-weight:600}
.savebar span.dirty{color:var(--warn)}

.scrim{position:fixed;inset:0;z-index:30;background:rgba(14,30,16,.45)}
.panel{position:fixed;z-index:40;left:0;right:0;bottom:0;max-height:94vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:700px){.panel{left:50%;right:auto;bottom:auto;top:50%;width:620px;transform:translate(-50%,-50%);border-radius:22px;max-height:90vh}}
.panel-head{display:flex;align-items:center;gap:10px}
.panel-head h2{flex:1;margin:0}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);font-size:22px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.chips button.on{background:var(--forest);border-color:var(--forest);color:#fff}
.chips button.def::after{content:" · alap";font-weight:500;opacity:.8}
.addunit{display:flex;gap:8px;margin-top:8px}
.addunit .field{height:40px;flex:1;min-width:0}
.addunit .btn{height:40px}
.toggles{display:grid;gap:8px;margin-top:16px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:var(--bg);font-weight:600;font-size:15px}
.tg small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.tg input{width:22px;height:22px;accent-color:var(--green-d)}
.img-box{display:flex;align-items:center;gap:14px;margin-top:6px}
.img-box .pv{width:96px;height:96px;border-radius:14px;background:var(--mint);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;flex:none}
.img-box .pv img{width:100%;height:100%;object-fit:cover}
.img-box .acts{display:flex;flex-direction:column;gap:8px}
.panel-foot{display:flex;gap:10px;margin-top:22px}
.panel-foot .go{flex:1}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);background:var(--forest);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--tomato)}
</style>
</head>

sztított termékek","units":["kg"],"variants":{"label":"Vágás","options":["egész","kocka","szelet"]},"orderable":true,"cleaned":true,"image":""},{"id":"tisztitott-lilahagyma","name":"Tisztított lilahagyma","cat":"Konyhakész, tisztított termékek","units":["kg"],"variants":{"label":"Vágás","options":["egész","kocka","szelet"]},"orderable":true,"cleaned":true,"image":""},{"id":"tisztitott-sargarepa","name":"Tisztított sárgarépa","cat":"Konyhakész, tisztított termékek","units":["kg"],"variants":{"label":"Vágás","options":["egész","kocka","karika","reszelt","julienne"]},"orderable":true,"cleaned":true,"image":""},{"id":"tisztitott-feherrepa","name":"Tisztított fehérrépa","cat":"Konyhakész, tisztított termékek","units":["kg"],"variants":{"label":"Vágás","options":["egész","kocka","karika","reszelt","julienne"]},"orderable":true,"cleaned":true,"image":""},{"id":"tisztitott-zeller","name":"Tisztított zeller","cat":"Konyhakész, tisztított termékek","units":["kg"],"variants":{"label":"Vágás","options":["egész","kocka","reszelt","julienne"]},"orderable":true,"cleaned":true,"image":""},{"id":"tisztitott-fejeskaposzta","name":"Tisztított fejeskáposzta","cat":"Konyhakész, tisztított termékek","units":["kg"],"variants":{"label":"Vágás","options":["egész","reszelt","szelet"]},"orderable":true,"cleaned":true,"image":""},{"id":"tisztitott-kelkaposzta","name":"Tisztított kelkáposzta, szeletelt","cat":"Konyhakész, tisztított termékek","units":["kg"],"variants":null,"orderable":true,"cleaned":true,"image":""},{"id":"tisztitott-voroskaposzta","name":"Tisztított vöröskáposzta, szeletelt","cat":"Konyhakész, tisztított termékek","units":["kg"],"variants":null,"orderable":true,"cleaned":true,"image":""},{"id":"tisztitott-karalabe","name":"Tisztított karalábé","cat":"Konyhakész, tisztított termékek","units":["kg"],"variants":null,"orderable":true,"cleaned":true,"image":""},{"id":"tisztitott-fokhagyma","name":"Tisztított fokhagyma","cat":"Konyhakész, tisztított termékek","units":["kg"],"variants":null,"orderable":true,"cleaned":true,"image":""},{"id":"tisztitott-kigyouborka-szeletelt","name":"Tisztított kígyóuborka, szeletelt","cat":"Konyhakész, tisztított termékek","units":["kg"],"variants":null,"orderable":true,"cleaned":true,"image":""}]};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => s.normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "termek";
let token = sessionStorage.getItem("nb_admin") || "";
let cat = null, dirty = false, editIdx = -1, draft = null, q = "";

function toast(m, err){ const t = $("#toast"); t.textContent = m; t.classList.toggle("err", !!err); t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(()=> t.classList.remove("show"), err ? 5000 : 2800); }
async function api(body){
  const r = await fetch(API, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
  const d = await r.json().catch(()=> ({ ok:false, error:"Váratlan válasz a szervertől." }));
  if(r.status === 401 && body.action !== "login"){ token = ""; sessionStorage.removeItem("nb_admin"); showLogin(true); }
  return d;
}

/* ---------- Belépés ---------- */
let setupMode = false;
async function showLogin(expired){
  $("#v-edit").hidden = true; $("#savebar").hidden = true; $("#v-login").hidden = false;
  let st = {};
  try{ st = await api({ action:"status" }); }catch{}
  setupMode = st.ok && !st.hasPassword;
  $("#l-title").textContent = setupMode ? "Jelszó beállítása" : "Belépés";
  $("#l-hint").textContent = setupMode
    ? "Első belépés: állíts be egy legalább 8 karakteres jelszót. Ezzel tudsz majd belépni."
    : expired ? "Lejárt a belépés, lépj be újra. A mentetlen változások megmaradtak." : "Add meg a fejlesztői jelszót.";
  $("#pw2-wrap").hidden = !setupMode;
  $("#l-btn").textContent = setupMode ? "Jelszó mentése és belépés" : "Belépés";
  if(!st.ok) $("#l-err").textContent = "A szerver nem érhető el. A fejlesztői mód csak a tárhelyre feltöltve működik.";
  $("#pw").focus();
}
$("#f-login").addEventListener("submit", async e => {
  e.preventDefault();
  $("#l-err").textContent = "";
  const pw = $("#pw").value;
  if(setupMode && pw !== $("#pw2").value){ $("#l-err").textContent = "A két jelszó nem egyezik."; return; }
  const d = await api({ action: setupMode ? "setup" : "login", password:pw });
  if(!d.ok){ $("#l-err").textContent = d.error || "Nem sikerült belépni."; return; }
  token = d.token; sessionStorage.setItem("nb_admin", token);
  $("#pw").value = ""; $("#pw2").value = "";
  openEditor();
});

/* ---------- Terméklista ---------- */
async function loadCatalog(){
  try{
    const r = await fetch("catalog.json?t=" + Date.now(), { cache:"no-store" });
    if(r.ok){ const c = await r.json(); if(c && Array.isArray(c.products) && c.products.length) return c; }
  }catch{}
  return JSON.parse(JSON.stringify(DEFAULT_CATALOG));
}
async function openEditor(){
  if(!cat) cat = await loadCatalog();
  $("#v-login").hidden = true; $("#v-edit").hidden = false; $("#savebar").hidden = false;
  render();
}
function setDirty(v){
  dirty = v;
  $("#b-save").disabled = !v;
  $("#s-state").textContent = v ? "Mentetlen változások" : "Minden mentve";
  $("#s-state").classList.toggle("dirty", v);
}
function render(){
  const cats = [...new Set(cat.products.map(p => p.cat))];
  $("#cats").innerHTML = cats.map(c => `<option value="${esc(c)}">`).join("");
  const ql = q.trim().toLowerCase();
  $("#list").innerHTML = cats.map(c => {
    const items = cat.products.map((p,i) => ({p,i})).filter(({p}) => p.cat === c && (!ql || p.name.toLowerCase().includes(ql)));
    if(!items.length) return "";
    return `<section class="cat"><h3>${esc(c)}</h3><ul class="rows">${items.map(({p,i}, j) => `
      <li class="row">
        <span class="th">${p.image ? `<img src="${esc(p.image)}" alt="">` : "–"}</span>
        <button class="main" type="button" data-edit="${i}"><b>${esc(p.name)}${!p.orderable?'<span class="badge b-off">nem rendelhető</span>':""}${p.hidden?'<span class="badge b-hid">rejtett</span>':""}${p.cleaned?'<span class="badge b-cl">tisztított</span>':""}</b>
          <small>${esc(p.units.join(", "))}${p.variants ? " · " + esc(p.variants.label) + ": " + esc(p.variants.options.join(", ")) : ""}</small></button>
        <button class="mv" type="button" data-up="${i}" ${j===0||ql?"disabled":""} aria-label="Feljebb">↑</button>
        <button class="mv" type="button" data-down="${i}" ${j===items.length-1||ql?"disabled":""} aria-label="Lejjebb">↓</button>
      </li>`).join("")}</ul></section>`;
  }).join("") || `<p class="hint" style="padding:30px 0">Nincs találat.</p>`;
}
function move(i, dir){
  const p = cat.products[i];
  let j = i + dir;
  while(j >= 0 && j < cat.products.length && cat.products[j].cat !== p.cat) j += dir;
  if(j < 0 || j >= cat.products.length) return;
  [cat.products[i], cat.products[j]] = [cat.products[j], cat.products[i]];
  setDirty(true); render();
}
$("#list").addEventListener("click", e => {
  const ed = e.target.closest("[data-edit]"); if(ed) return openPanel(+ed.dataset.edit);
  const up = e.target.closest("[data-up]"); if(up) return move(+up.dataset.up, -1);
  const dn = e.target.closest("[data-down]"); if(dn) return move(+dn.dataset.down, 1);
});
$("#q").addEventListener("input", e => { q = e.target.value; render(); });

/* ---------- Szerkesztő panel ---------- */
function openPanel(i){
  editIdx = i;
  const base = i >= 0 ? cat.products[i] : { id:"", name:"", cat:"", units:["kg"], variants:null, orderable:true, cleaned:false, hidden:false, image:"" };
  draft = JSON.parse(JSON.stringify(base));
  $("#e-title").textContent = i >= 0 ? "Termék szerkesztése" : "Új termék";
  $("#e-name").value = draft.name; $("#e-cat").value = draft.cat;
  $("#e-vlabel").value = draft.variants?.label || ""; $("#e-vopts").value = (draft.variants?.options || []).join(", ");
  $("#e-ord").checked = !!draft.orderable; $("#e-cl").checked = !!draft.cleaned; $("#e-hid").checked = !!draft.hidden;
  $("#e-err").textContent = ""; $("#e-del").hidden = i < 0; $("#e-del").classList.remove("sure"); $("#e-del").textContent = "Törlés";
  renderUnits(); renderImg();
  $("#panel").hidden = false; $("#scrim").hidden = false; $("#e-name").focus();
}
function closePanel(){ $("#panel").hidden = true; $("#scrim").hidden = true; draft = null; }
function renderUnits(){
  const all = [...new Set([...(cat.units || []), ...draft.units])];
  $("#e-units").innerHTML = all.map(u => { const on = draft.units.includes(u);
    return `<button type="button" data-u="${esc(u)}" class="${on?"on":""} ${draft.units[0]===u?"def":""}" aria-pressed="${on}">${esc(u)}</button>`; }).join("");
}
function renderImg(){
  $("#e-img").innerHTML = draft.image ? `<img src="${esc(draft.image)}" alt="">` : "Nincs kép";
  $("#e-delimg").hidden = !draft.image;
}
let lastTap = { u:"", t:0 };
$("#e-units").addEventListener("click", e => {
  const b = e.target.closest("[data-u]"); if(!b) return;
  const u = b.dataset.u, now = Date.now();
  if(lastTap.u === u && now - lastTap.t < 400){            // dupla koppintás: legyen az alapértelmezett
    draft.units = [u, ...draft.units.filter(x => x !== u)];
  } else if(draft.units.includes(u)){
    if(draft.units.length > 1) draft.units = draft.units.filter(x => x !== u);
  } else draft.units.push(u);
  lastTap = { u, t:now };
  renderUnits();
});
$("#e-addunit").addEventListener("click", () => {
  const u = $("#e-newunit").value.trim(); if(!u) return;
  cat.units = [...new Set([...(cat.units || []), u])];
  if(!draft.units.includes(u)) draft.units.push(u);
  $("#e-newunit").value = ""; renderUnits(); setDirty(true);
});
$("#e-file").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = "";
  if(!f) return;
  if(!draft.id && !$("#e-name").value.trim()){ toast("Előbb add meg a termék nevét.", true); return; }
  const id = draft.id || slug($("#e-name").value);
  const fd = new FormData(); fd.append("action","upload"); fd.append("token",token); fd.append("id",id); fd.append("file",f);
  $("#e-img").textContent = "Feltöltés…";
  try{
    const r = await fetch(API, { method:"POST", body:fd });
    const d = await r.json();
    if(!d.ok) throw new Error(d.error || "Hiba");
    draft.image = d.image; renderImg(); toast("Kép feltöltve. Ne felejts el menteni.");
  }catch(err){ renderImg(); toast(err.message || "A feltöltés nem sikerült.", true); }
});
$("#e-delimg").addEventListener("click", () => { draft.image = ""; renderImg(); });
$("#e-del").addEventListener("click", e => {
  const b = e.currentTarget;
  if(!b.classList.contains("sure")){ b.classList.add("sure"); b.textContent = "Biztosan törlöd?"; return; }
  cat.products.splice(editIdx, 1); closePanel(); setDirty(true); render(); toast("Termék törölve. Mentéssel lesz végleges.");
});
$("#e-close").addEventListener("click", closePanel);
$("#scrim").addEventListener("click", closePanel);
document.addEventListener("keydown", e => { if(e.key === "Escape" && !$("#panel").hidden) closePanel(); });
$("#panel").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("#e-name").value.trim(), c = $("#e-cat").value.trim();
  if(!name){ $("#e-err").textContent = "Add meg a termék nevét."; return; }
  if(!c){ $("#e-err").textContent = "Adj meg kategóriát."; return; }
  const opts = [...new Set($("#e-vopts").value.split(",").map(s => s.trim()).filter(Boolean))];
  draft.name = name; draft.cat = c;
  draft.variants = opts.length ? { label: $("#e-vlabel").value.trim() || "Változat", options: opts } : null;
  draft.orderable = $("#e-ord").checked; draft.cleaned = $("#e-cl").checked; draft.hidden = $("#e-hid").checked;
  if(editIdx < 0){
    let id = slug(name), n = 2;
    while(cat.products.some(p => p.id === id)) id = slug(name) + "-" + n++;
    draft.id = id;
    // Új termék a kategóriája végére kerül
    let at = -1; cat.products.forEach((p,i) => { if(p.cat === c) at = i; });
    cat.products.splice(at >= 0 ? at + 1 : cat.products.length, 0, draft);
  } else cat.products[editIdx] = draft;
  closePanel(); setDirty(true); render();
});
$("#b-new").addEventListener("click", () => openPanel(-1));

/* ---------- Mentés ---------- */
$("#b-save").addEventListener("click", async () => {
  const b = $("#b-save"); b.disabled = true; b.textContent = "Mentés…";
  const d = await api({ action:"save", token, catalog:cat });
  b.textContent = "Mentés";
  if(!d.ok){ b.disabled = false; toast(d.error || "Nem sikerült menteni.", true); return; }
  setDirty(false); toast(`Mentve (${d.count} termék). A vevők az oldal újratöltése után már ezt látják.`);
});
addEventListener("beforeunload", e => { if(dirty){ e.preventDefault(); e.returnValue = ""; } });

/* ---------- Indulás ---------- */
if(token) openEditor(); else showLogin();
</script>
</body>
</html>
